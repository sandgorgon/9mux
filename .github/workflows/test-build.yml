name: Test Build

# Ad hoc, non-release builds for test/* branches: uploads a linux/amd64
# binary as a workflow artifact (Actions tab) instead of cutting a
# tagged GitHub Release, so a fix can be verified before release.yml
# (which triggers on v* tags) ever runs.
on:
  push:
    branches:
      - 'test/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" -o build/9mux ./cmd/9mux

      # Artifact names can't contain "/", which github.ref_name has for
      # a branch like test/controlstrip-reverse-fix.
      - name: Compute artifact name
        run: echo "artifact_name=9mux-${GITHUB_REF_NAME//\//-}-linux-amd64" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifact_name }}
          path: build/9mux
          retention-days: 7
